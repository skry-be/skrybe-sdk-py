name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported (requires-python); 3.13 the newest.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A non-editable install, so the tests run against what a wheel ships
      # (py.typed included) rather than the source tree.
      # pip < 26.2.2 trusts the compromised eMudhra/emSign CAs through its vendored
      # certifi (python.org advisory, 2026-10-20). The wheel is pinned by hash.
      - run: python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pip < 26.2.2 trusts the compromised eMudhra/emSign CAs through its vendored
      # certifi (python.org advisory, 2026-10-20). The wheel is pinned by hash.
      - run: python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
      - run: python -m pip install build twine mypy types-requests
      - run: mypy --strict src/skrybe
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and imports on its own
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c 'import skrybe; skrybe.Skrybe("k"); print(skrybe.VERSION)'
