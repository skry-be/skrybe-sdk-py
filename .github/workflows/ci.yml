name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # setup-python has no 3.9 build for ubuntu-latest (26.04); 24.04 has every version below.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported (requires-python); 3.13 the newest.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A non-editable install, so the tests run against what a wheel ships
      # (py.typed included) rather than the source tree.
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine mypy types-requests
      - run: mypy --strict src/skrybe
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and imports on its own
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c 'import skrybe; skrybe.Skrybe("k"); print(skrybe.VERSION)'
